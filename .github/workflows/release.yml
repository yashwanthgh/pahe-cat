name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # ── Gate: fail fast before spending 4 platform builds ────────────────────
  check:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  # ── Android APK ──────────────────────────────────────────────────────────
  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk

  # ── macOS ─────────────────────────────────────────────────────────────────
  macos:
    name: macOS App
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip macOS app
        run: |
          cd build/macos/Build/Products/Release
          zip -r PaheBoy-macOS.zip "Pahe Boy.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: build/macos/Build/Products/Release/PaheBoy-macOS.zip

  # ── Windows ───────────────────────────────────────────────────────────────
  windows:
    name: Windows EXE
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip Windows build
        run: Compress-Archive build/windows/x64/runner/Release/* PaheBoy-Windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: PaheBoy-Windows.zip

  # ── Linux ─────────────────────────────────────────────────────────────────
  linux:
    name: Linux Build
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Tar Linux build
        run: tar -czf PaheBoy-Linux.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: PaheBoy-Linux.tar.gz

  # ── GitHub Release ────────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [android, macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Pahe Boy ${{ github.ref_name }}"
          body: |
            ## Pahe Boy ${{ github.ref_name }}

            AnimePahe client with watch progress tracking, sub/dub selection, and downloads.

            ### Downloads
            | Platform | File |
            |----------|------|
            | Android | `PaheBoy-arm64-v8a-release.apk` (recommended) |
            | Android (32-bit) | `PaheBoy-armeabi-v7a-release.apk` |
            | macOS | `PaheBoy-macOS.zip` |
            | Windows | `PaheBoy-Windows.zip` |
            | Linux | `PaheBoy-Linux.tar.gz` |

            ### First Run
            The app will do a one-time Cloudflare verification when it first opens.

            ---
            MIT License · [Source](https://github.com/${{ github.repository }})
          files: |
            artifacts/android-apk/*.apk
            artifacts/macos-app/PaheBoy-macOS.zip
            artifacts/windows-exe/PaheBoy-Windows.zip
            artifacts/linux-build/PaheBoy-Linux.tar.gz
          draft: false
          prerelease: false
