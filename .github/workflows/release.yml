name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # ── Gate: fail fast before spending 4 platform builds ────────────────────
  check:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  # ── Android APK ──────────────────────────────────────────────────────────
  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk

  # ── macOS ─────────────────────────────────────────────────────────────────
  macos:
    name: macOS App
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package macOS app as a DMG
        run: |
          cd build/macos/Build/Products/Release
          mkdir -p dmg && cp -R "Pahe Cat.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Pahe Cat" -srcfolder dmg \
            -ov -format UDZO PaheCat-macOS.dmg
          zip -r PaheCat-macOS.zip "Pahe Cat.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            build/macos/Build/Products/Release/PaheCat-macOS.dmg
            build/macos/Build/Products/Release/PaheCat-macOS.zip

  # ── Windows ───────────────────────────────────────────────────────────────
  windows:
    name: Windows EXE
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip Windows build
        # The whole Release folder, not just the exe: the Flutter engine DLL
        # and the data folder sit beside it and the app will not start without
        # them.
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath PaheCat-Windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: PaheCat-Windows.zip

  # ── Linux ─────────────────────────────────────────────────────────────────
  linux:
    name: Linux Build
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Tar Linux build
        run: tar -czf PaheCat-Linux.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: PaheCat-Linux.tar.gz

  # ── GitHub Release ────────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [android, macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Pahe Cat ${{ github.ref_name }}"
          body: |
            ## Pahe Cat ${{ github.ref_name }}

            AnimePahe client with watch progress tracking, sub/dub selection, and downloads.

            ### Downloads
            | Platform | File |
            |----------|------|
            | Android | `PaheCat-arm64-v8a-release.apk` (recommended) |
            | Android (32-bit) | `PaheCat-armeabi-v7a-release.apk` |
            | macOS | `PaheCat-macOS.dmg` |
            | Windows | `PaheCat-Windows.zip` |
            | Linux | `PaheCat-Linux.tar.gz` |

            ### First run
            **Windows** — unzip and run `pahe_cat.exe`. Keep the whole folder
            together; the exe needs the engine DLL and `data/` beside it.

            **macOS** — the app is unsigned, so the first launch needs
            right-click (or Control-click) then **Open**, rather than a
            double-click.

            On first start the app checks the site is reachable. This usually
            passes on its own in a few seconds. If a checkbox appears, tick it
            once.

            ---
            MIT License · [Source](https://github.com/${{ github.repository }})
          files: |
            artifacts/android-apk/*.apk
            artifacts/macos-app/PaheCat-macOS.dmg
            artifacts/macos-app/PaheCat-macOS.zip
            artifacts/windows-exe/PaheCat-Windows.zip
            artifacts/linux-build/PaheCat-Linux.tar.gz
          draft: false
          prerelease: false
