name: pahe_cat
description: AnimePahe client — watch progress, downloads, sub/dub, all platforms.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  dio: ^5.4.3
  html: ^0.15.4

  # WebView (CF bypass + kwik.si resolution).
  # 6.1+ is required: the android sub-package in 6.0.0 referenced the old
  # proguard-android.txt, which modern Android Gradle Plugin rejects outright.
  flutter_inappwebview: ^6.1.5

  # Local DB — watch progress, history
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  # State management
  flutter_riverpod: ^2.5.1

  # UI extras
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3

  # Opening episodes in an external player, and files on disk
  url_launcher: ^6.2.5
  open_filex: ^4.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    # assets/images/ was declared here but never populated. git cannot track an
    # empty directory, so the Windows build failed outright with "unable to
    # find directory entry in pubspec.yaml".
    - assets/icon/

  # Bundled rather than fetched by google_fonts at runtime: on a cold start
  # with no cache the download can fail, and Flutter then renders the fallback
  # font with yellow underlines.
  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand.ttf

# Regenerate with: dart run flutter_launcher_icons
# Source art comes from tools/make_icon.py
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
