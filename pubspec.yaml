name: pahe_boy
description: AnimePahe client — watch progress, downloads, sub/dub, all platforms.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  dio: ^5.4.3
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

  # WebView (CF bypass + kwik.si resolution)
  flutter_inappwebview: ^6.0.0

  # Local DB — watch progress, history
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  # State management
  flutter_riverpod: ^2.5.1

  # UI extras
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3
  share_plus: ^9.0.0
  open_filex: ^4.3.4
  url_launcher: ^6.2.5

  # Notifications / downloads
  flutter_local_notifications: ^17.1.2
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
