name: pahe_cat
description: AnimePahe client — watch progress, downloads, sub/dub, all platforms.
publish_to: none
# Kept in step with the released tag, and with kAppVersion in
# lib/screens/settings_screen.dart, so the About row and the download the user
# installed agree.
version: 0.3.2+5

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  dio: ^5.4.3
  html: ^0.15.4

  # WebView (CF bypass + kwik.si resolution).
  # 6.1+ is required: the android sub-package in 6.0.0 referenced the old
  # proguard-android.txt, which modern Android Gradle Plugin rejects outright.
  flutter_inappwebview: ^6.1.5

  # Local DB — watch progress, history
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  # State management
  flutter_riverpod: ^2.5.1

  # UI extras
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3

  # Opening episodes in an external player, and files on disk
  url_launcher: ^6.2.5
  open_filex: ^4.3.4

# The macOS WebView plugin is vendored and patched.
#
# Its download delegate discards every download — it reports the URL to Dart
# and cancels the transfer. That URL cannot be fetched by anything else: the
# media host's Cloudflare rules refuse every request the app can make, while
# accepting the WebView's own navigation, which delivers the file in about a
# fifth of a second. Keeping those bytes is the only way to download an
# episode without asking the viewer to click a button in a browser.
#
# See the PAHE CAT PATCH comments in
# packages/flutter_inappwebview_macos/macos/Classes/InAppWebView/InAppWebView.swift
#
# The Windows copy is vendored for the same reason, though its bug is the
# opposite one: it never subscribes to WebView2's DownloadStarting at all, so
# the "onDownloadStartRequest" message its own Dart side handles could never
# arrive and a download never began. See the PAHE CAT PATCH comments in
# packages/flutter_inappwebview_windows/windows/in_app_webview/in_app_webview.cpp
dependency_overrides:
  flutter_inappwebview_macos:
    path: packages/flutter_inappwebview_macos
  flutter_inappwebview_windows:
    path: packages/flutter_inappwebview_windows

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    # assets/images/ was declared here but never populated. git cannot track an
    # empty directory, so the Windows build failed outright with "unable to
    # find directory entry in pubspec.yaml".
    - assets/icon/

  # Bundled rather than fetched by google_fonts at runtime: on a cold start
  # with no cache the download can fail, and Flutter then renders the fallback
  # font with yellow underlines.
  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand.ttf

# Regenerate with: dart run flutter_launcher_icons
# Source art comes from tools/make_icon.py
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
